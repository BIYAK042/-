<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rhythm Card Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #eeeeee;
  font-family: Arial, sans-serif;
  color: #333;
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.editor {
  background: white;
  padding: 20px;
  border-radius: 18px;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

input[type="file"] {
  background: white;
}

button {
  margin-top: 20px;
  background: #333;
  color: white;
  border: none;
  cursor: pointer;
}

.preview-area {
  display: flex;
  justify-content: center;
}

.card {
  width: 300px;
  height: 420px;
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  background: linear-gradient(135deg, #ddd, #888);
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.card-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-info {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 25px 15px 18px;
  color: white;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,0.85)
  );
}

.rarity {
  font-size: 20px;
  margin-bottom: 5px;
}

.card-name {
  font-size: 25px;
  font-weight: bold;
}

.character-name {
  font-size: 15px;
  margin-top: 5px;
}

.empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: white;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 Rhythm Card Maker</h1>

<div class="editor">

<label>카드 이미지</label>
<input type="file" id="imageInput" accept="image/*">

<label>카드 이름</label>
<input type="text" id="cardName" placeholder="예: 별빛 아래의 약속">

<label>캐릭터 이름</label>
<input type="text" id="characterName" placeholder="예: ○○○">

<label>등급</label>
<select id="rarity">
  <option value="★">★</option>
  <option value="★★">★★</option>
  <option value="★★★">★★★</option>
  <option value="★★★★">★★★★</option>
  <option value="★★★★★">★★★★★</option>
</select>

<button onclick="updateCard()">카드 만들기</button>

</div>

<div class="preview-area">

<div class="card">

  <img id="cardImage" class="card-image" style="display:none;">

  <div id="emptyText" class="empty">
    이미지를 넣어주세요
  </div>

  <div class="card-info">

    <div id="rarityText" class="rarity">
      ★
    </div>

    <div id="cardNameText" class="card-name">
      카드 이름
    </div>

    <div id="characterNameText" class="character-name">
      캐릭터 이름
    </div>

  </div>

</div>

</div>

</div>

<script>

const imageInput = document.getElementById("imageInput");

imageInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    const image = document.getElementById("cardImage");

    image.src = e.target.result;
    image.style.display = "block";

    document.getElementById("emptyText").style.display = "none";

  };

  reader.readAsDataURL(file);

});

function updateCard() {

  const cardName =
    document.getElementById("cardName").value;

  const characterName =
    document.getElementById("characterName").value;

  const rarity =
    document.getElementById("rarity").value;

  document.getElementById("cardNameText").textContent =
    cardName || "카드 이름";

  document.getElementById("characterNameText").textContent =
    characterName || "캐릭터 이름";

  document.getElementById("rarityText").textContent =
    rarity;

}

</script>

</body>
</html>
